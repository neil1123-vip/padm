name: Docker CI

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'docker/**'
      - 'docker-bake.hcl'
      - 'install.sh'
      - 'install-docker.sh'
      - 'shell/**'
      - 'versions.lock'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      native_parallel_jobs:
        description: Top-level native regression workers (2-4 for benchmark/recovery)
        required: false
        default: '3'
        type: string

permissions:
  contents: read

concurrency:
  group: docker-ci-branch-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static:
    name: Native static checks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.sh' | xargs -0 -r -n 1 bash -n

  native:
    name: Native shell and workflow checks
    needs: static
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      PADM_REGRESSION_CI_PARALLEL_JOBS: ${{ github.event_name == 'workflow_dispatch' && inputs.native_parallel_jobs || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run native regression profile
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PADM_REGRESSION_CI_PARALLEL_JOBS}" &&
            ! "${PADM_REGRESSION_CI_PARALLEL_JOBS}" =~ ^[2-4]$ ]]; then
            echo 'native_parallel_jobs must be 2, 3 or 4' >&2
            exit 2
          fi
          selector=ci
          if [[ "${GITHUB_EVENT_NAME}" == pull_request && "${PR_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            changed=$(git diff --name-only "${PR_BASE_SHA}" HEAD)
            if ! grep -Eq '^(shell/subscription/|shell/regression/(framework|cases/subscription[.]sh|suites/subscription[.]sh)|shell/subscription_groups_regression[.]sh)' <<<"${changed}"; then
              selector=ci-pr
            fi
          fi
          printf 'Native regression selector: %s\n' "${selector}" >>"${GITHUB_STEP_SUMMARY}"
          bash shell/subscription_groups_regression.sh "${selector}"

  images:
    needs: [static, native]
    uses: ./.github/workflows/build-images.yml
    concurrency:
      group: docker-ci-head-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: true
    with:
      version: dev
      source_ref: ${{ github.sha }}
      registry: ghcr.io/neil1123-vip
      push: false
