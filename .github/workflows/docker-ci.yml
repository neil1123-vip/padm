name: Docker CI

on:
  pull_request:
    paths:
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'docker/**'
      - 'docker-bake.hcl'
      - 'install.sh'
      - 'install-docker.sh'
      - 'shell/**'
      - 'versions.lock'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      native_host_probe:
        description: Run only the isolated native ARM64 host preflight
        default: false
        type: boolean
      native_parallel_jobs:
        description: Top-level native regression workers (2-4 for benchmark/recovery)
        required: false
        default: '3'
        type: string

permissions:
  contents: read

concurrency:
  group: docker-ci-branch-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static:
    name: Native static checks
    if: ${{ !inputs.native_host_probe }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.checked.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows
        run: bash shell/regression/lint-ci-workflows.sh
      - name: Check shell syntax
        id: checked
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.sh' | xargs -0 -r -n 1 bash -n
          git rev-parse HEAD | sed 's/^/source_sha=/' >>"${GITHUB_OUTPUT}"

  native:
    name: Native shell and workflow checks
    needs: static
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      PADM_REGRESSION_CI_PARALLEL_JOBS: ${{ github.event_name == 'workflow_dispatch' && inputs.native_parallel_jobs || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.static.outputs.source_sha }}
          fetch-depth: 0
      - name: Install pinned jq
        run: sudo bash shell/regression/install-ci-jq.sh
      - name: Run native regression profile
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PADM_REGRESSION_CI_PARALLEL_JOBS}" &&
            ! "${PADM_REGRESSION_CI_PARALLEL_JOBS}" =~ ^[2-4]$ ]]; then
            echo 'native_parallel_jobs must be 2, 3 or 4' >&2
            exit 2
          fi
          selector=ci
          if [[ "${GITHUB_EVENT_NAME}" == pull_request && "${PR_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            changed=$(git diff --name-only "${PR_BASE_SHA}" HEAD)
            if ! grep -Eq '^(shell/subscription/|shell/regression/|shell/subscription_groups_regression[.]sh)' <<<"${changed}"; then
              selector=ci-pr
            fi
          fi
          printf 'Native regression selector: %s\n' "${selector}" >>"${GITHUB_STEP_SUMMARY}"
          bash shell/subscription_groups_regression.sh "${selector}"

  tls:
    name: TLS transactions and renewal
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.static.outputs.source_sha }}
      - name: Install pinned jq
        run: sudo bash shell/regression/install-ci-jq.sh
      - name: Check Docker TLS transactions and renewal
        shell: bash
        run: sudo env TMPDIR=/tmp bash shell/subscription_groups_regression.sh docker-tls-focused

  signing:
    name: Cosign install and signature checks
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.static.outputs.source_sha }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Check signing and tamper rejection
        run: bash shell/regression/check-cosign.sh

  contracts:
    needs: static
    uses: ./.github/workflows/docker-contracts.yml
    with:
      source_ref: ${{ needs.static.outputs.source_sha }}

  images:
    needs: [static, native, tls, signing, contracts]
    uses: ./.github/workflows/build-images.yml
    concurrency:
      group: docker-ci-head-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: true
    with:
      version: dev
      source_ref: ${{ needs.static.outputs.source_sha }}
      registry: ghcr.io/neil1123-vip
      push: false
      base_ref: ${{ github.event.pull_request.base.sha || '' }}

  native-host-probe:
    name: Native ARM64 host preflight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_host_probe }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Collect native host capabilities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${RUNNER_TEMP}/native-arm64-host-preflight.json"
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          def probe(arguments):
              result = subprocess.run(arguments, capture_output=True, text=True, timeout=30)
              return dict(arguments=arguments, returncode=result.returncode,
                          stdout=result.stdout, stderr=result.stderr)

          commands = {
              "uname": ["uname", "-a"],
              "pid1": ["cat", "/proc/1/comm"],
              "systemd": ["systemctl", "is-system-running"],
              "docker_service": ["systemctl", "show", "docker.service",
                                 "-p", "ActiveState", "-p", "UnitFileState", "-p", "MainPID"],
              "sudo": ["sudo", "-n", "true"],
              "compose": ["docker", "compose", "version", "--short"],
              "root_mount": ["findmnt", "-n", "-o", "FSTYPE,SOURCE", "/"],
              "global_ipv6": ["ip", "-j", "-6", "address", "show", "scope", "global"],
              "kvm": ["test", "-c", "/dev/kvm"],
          }
          values = {name: probe(arguments) for name, arguments in commands.items()}
          engine = probe(["docker", "info", "--format", "{{json .}}"])
          assert engine["returncode"] == 0, engine
          info = json.loads(engine["stdout"])
          engine["stdout"] = {key: info[key] for key in (
              "Architecture", "OSType", "KernelVersion", "OperatingSystem", "ServerVersion",
              "Driver", "DriverStatus", "CgroupDriver", "CgroupVersion", "SecurityOptions")}
          result = dict(
              source=os.environ["GITHUB_SHA"], run_id=os.environ["GITHUB_RUN_ID"],
              architecture=platform.machine(), os_release=Path("/etc/os-release").read_text(),
              probes=values, docker=engine,
              nested_virtualization_available=values["kvm"]["returncode"] == 0,
          )
          assert result["architecture"] == "aarch64"
          assert values["pid1"]["stdout"].strip() == "systemd"
          assert values["sudo"]["returncode"] == values["compose"]["returncode"] == 0
          assert info["Architecture"] in {"aarch64", "arm64"} and info["OSType"] == "linux"
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Preserve capability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-arm64-host-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/native-arm64-host-preflight.json
          if-no-files-found: error
