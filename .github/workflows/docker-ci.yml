name: Docker CI

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'docker/**'
      - 'docker-bake.hcl'
      - 'install.sh'
      - 'install-docker.sh'
      - 'shell/**'
      - 'versions.lock'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-branch-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native:
    name: Native shell and workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Check shell syntax and native regressions
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.sh' | xargs -0 -r -n 1 bash -n
          bash shell/subscription_groups_regression.sh ci

  images:
    needs: native
    uses: ./.github/workflows/build-images.yml
    concurrency:
      group: docker-ci-head-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: true
    with:
      version: dev
      source_ref: ${{ github.sha }}
      registry: ghcr.io/neil1123-vip
      push: false
