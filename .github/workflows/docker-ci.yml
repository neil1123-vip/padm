name: Docker CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-arm64-uri:
    name: Formal native ARM64 Reality URI
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned jq
        run: sudo bash shell/regression/install-ci-jq.sh
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3
      - name: Verify and unpack the two signed releases
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/padm-arm64-uri"
          mkdir -p "${work}/evidence"
          for ver in v3.44.3 v3.44.4; do
            dir="${work}/${ver}"
            mkdir -p "${dir}/source"
            for asset in release-manifest.json release-manifest.sigstore.json padm-docker-bundle.tar.gz; do
              curl -fLSs --retry 2 --connect-timeout 10 --max-time 120 \
                "https://github.com/neil1123-vip/padm/releases/download/${ver}/${asset}" -o "${dir}/${asset}"
            done
            cosign verify-blob --bundle "${dir}/release-manifest.sigstore.json" \
              --certificate-identity 'https://github.com/neil1123-vip/padm/.github/workflows/create_release.yml@refs/heads/main' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "${dir}/release-manifest.json" 2>&1 | tee "${work}/evidence/${ver}-signature.log"
            if [[ "${ver}" == v3.44.4 ]]; then
              commit=25d99b1143d116da951c8eb9e6c47540bb22d898
              sha=f76e8843755ccea9b31ce0551fb80319f51f9ce631a79193a868c7f29ad7cbc2
            else
              commit=ba3c23666cb573ba99d87abe4dae8699fc0f1110
              sha=37fc003d60bf3ba90cc800ef06f5381eec29853a654febd967eecade0a3e7ee8
            fi
            jq -e --arg commit "${commit}" --arg sha "${sha}" --arg ver "${ver#v}" \
              '.release.commit == $commit and .release.version == $ver and .control.sha256 == $sha' \
              "${dir}/release-manifest.json" >/dev/null
            printf '%s  %s\n' "${sha}" "${dir}/padm-docker-bundle.tar.gz" | sha256sum --check
            tar -xzf "${dir}/padm-docker-bundle.tar.gz" -C "${dir}/source"
            cp "${dir}/release-manifest.json" "${work}/evidence/${ver}-manifest.json"
          done
      - name: Exercise direct file-provider import
        run: sudo env PATH="${PATH}" GITHUB_SHA="${GITHUB_SHA}" GITHUB_RUN_ID="${GITHUB_RUN_ID}" python3 -B shell/regression/native-arm64-uri.py "${RUNNER_TEMP}/padm-arm64-uri"
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-arm64-uri-${{ github.run_id }}
          path: ${{ runner.temp }}/padm-arm64-uri/evidence
          if-no-files-found: error
          retention-days: 14
