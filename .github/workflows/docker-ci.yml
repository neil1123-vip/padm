name: Docker CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-icmp:
    name: Formal Debian 13 ICMP in disposable KVM
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.0.5
      - name: Install disposable hypervisor tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage socat
      - name: Stage signed release and fixed Debian parent
        run: sudo env PATH="${PATH}" python3 -B shell/regression/native-icmp-3443/stage-host.py
      - name: Run formal native ICMP scenarios
        run: sudo python3 -B /tmp/padm-icmp-kvm/input/run-native-icmp.py
      - name: Encrypt private guest evidence
        if: always()
        run: sudo env GITHUB_RUN_ID="${GITHUB_RUN_ID}" GITHUB_SHA="${GITHUB_SHA}" python3 -B shell/regression/native-icmp-3443/stage-host.py --archive
      - name: Preserve encrypted evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-icmp-kvm-${{ github.run_id }}
          path: /tmp/padm-icmp-kvm/public/
          if-no-files-found: error
          retention-days: 14
