name: Docker CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-icmp-preflight:
    name: Formal ICMP independent egress preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.0.5
      - name: Check the fixture parser
        run: python3 -B shell/regression/icmp-egress-preflight.py --self-check
      - name: Probe independent host and formal target gate
        run: sudo env PATH="${PATH}" GITHUB_RUN_ID="${GITHUB_RUN_ID}" GITHUB_SHA="${GITHUB_SHA}" python3 -B shell/regression/icmp-egress-preflight.py
      - name: Preserve public preflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-icmp-preflight-${{ github.run_id }}
          path: /tmp/padm-icmp-preflight/public/
          if-no-files-found: error
          retention-days: 14
