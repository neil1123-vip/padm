name: Docker CI

on:
  pull_request:
    paths:
      - '.github/workflows/build-images.yml'
      - '.github/workflows/docker-ci.yml'
      - '.github/workflows/create_release.yml'
      - 'docker/**'
      - 'docker-bake.hcl'
      - 'install-docker.sh'
      - 'shell/core/deployment_mode.sh'
      - 'shell/core/stats_grpc.sh'
      - 'shell/core/version.sh'
      - 'versions.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-branch-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  images:
    uses: ./.github/workflows/build-images.yml
    concurrency:
      group: docker-ci-head-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: true
    with:
      version: dev
      source_ref: ${{ github.sha }}
      registry: ghcr.io/neil1123-vip
      push: false
