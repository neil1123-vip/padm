name: Docker Contracts

on:
  workflow_call:
    inputs:
      source_ref:
        description: Full source commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  contracts:
    name: Docker contracts (${{ matrix.selector }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      max-parallel: 8
      matrix:
        selector:
          - docker-setup-core
          - docker-setup-encrypted
          - docker-setup-transports
          - docker-setup-tls
          - docker-traditional-tls
          - docker-contracts-reality
          - docker-contracts-system
          - docker-contracts-fast
    steps:
      - name: Checkout checked source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
      - name: Prepare control and site contract tools
        if: matrix.selector == 'docker-contracts-fast'
        shell: bash
        run: |
          docker build --tag padm-regression:contracts shell/regression/container
      - name: Run contract shard
        shell: bash
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          set -euo pipefail
          if [[ "${SELECTOR}" == docker-contracts-fast ]]; then
            git ls-files -z | tar --null -T - -cf "${RUNNER_TEMP}/padm-contracts-source.tar"
            docker run --rm --network none --init \
              --env PADM_REGRESSION_PARALLEL_JOBS=2 \
              --mount "type=bind,src=${RUNNER_TEMP}/padm-contracts-source.tar,dst=/snapshot.tar,readonly" \
              padm-regression:contracts "${SELECTOR}"
          else
            sudo env TMPDIR=/tmp PADM_REGRESSION_PARALLEL_JOBS=2 bash shell/subscription_groups_regression.sh "${SELECTOR}"
          fi
