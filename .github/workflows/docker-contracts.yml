name: Docker Contracts

on:
  workflow_call:
    inputs:
      source_ref:
        description: Full source commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  contracts:
    name: Docker contracts (${{ matrix.selector }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PADM_DOCKER_CONTRACTS_SHARED_CHECKS: '1'
      CONTRACT_TOOLS: ${{ startsWith(matrix.selector, 'docker-contracts-fast-') || startsWith(matrix.selector, 'docker-routing-') || matrix.selector == 'docker-port-hopping-preflight' || matrix.selector == 'docker-contracts-reality-metadata' || matrix.selector == 'docker-contracts-recovery' || matrix.selector == 'docker-xhttp-edit' }}
    strategy:
      fail-fast: true
      # 留出原生与 TLS 门禁的两个槽位，避免长分片排队。
      max-parallel: 18
      matrix:
        selector:
          - docker-port-hopping-preflight
          - docker-contracts-fast-rest
          - docker-contracts-recovery
          - docker-xhttp-edit
          - docker-phase3-edit
          - docker-phase3-entries
          - docker-reality-targets-direct
          - docker-contracts-setup-transports
          - docker-contracts-fast-heavy
          - docker-phase4-maintenance
          - docker-contracts-system-light
          - docker-contracts-setup-basic
          - docker-contracts-reality-metadata
          - docker-reality
          - docker-routing-direct-block-ip-workflow
          - docker-routing-dns-csv
          - docker-routing-core-policy-lifecycle
          - docker-routing-core-network
    steps:
      - name: Checkout checked source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
      - name: Install pinned jq
        if: env.CONTRACT_TOOLS != 'true'
        run: sudo bash shell/regression/install-ci-jq.sh
      - name: Cache contract tools
        if: env.CONTRACT_TOOLS == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/padm-contract-tools.tar
          key: padm-contract-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell/regression/container/**') }}
      - name: Prepare control and site contract tools
        if: env.CONTRACT_TOOLS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/padm-contract-tools.tar"
          if [[ -f "${tools}" ]]; then
            docker load --input "${tools}"
          else
            docker build --tag padm-regression:contracts shell/regression/container
            docker save --output "${tools}" padm-regression:contracts
          fi
      - name: Run contract shard
        shell: bash
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          set -euo pipefail
          # ML-KEM 配对校验需要工具镜像中的 OpenSSL 3.5，不能使用旧版 runner 工具。
          if [[ "${CONTRACT_TOOLS}" == true ]]; then
            jobs=2
            if [[ "${SELECTOR}" == docker-contracts-fast-* ]]; then jobs=4; fi
            capabilities=()
            if [[ "${SELECTOR}" == docker-contracts-fast-rest || "${SELECTOR}" == docker-port-hopping-preflight ]]; then
              # Ubuntu 的 docker-default AppArmor 禁止夹具在私有命名空间挂载。
              capabilities=(--cap-add SYS_PTRACE --cap-add SYS_ADMIN --security-opt apparmor=unconfined)
            fi
            git ls-files -z | tar --null -T - -cf "${RUNNER_TEMP}/padm-contracts-source.tar"
            docker run --rm --network none --init "${capabilities[@]}" \
              --tmpfs /work:rw,exec,mode=0755 --tmpfs /tmp:rw,exec,mode=1777 \
              --env PADM_REGRESSION_PARALLEL_JOBS="${jobs}" \
              --env PADM_DOCKER_CONTRACTS_SHARED_CHECKS \
              --env PADM_REGRESSION_VERBOSE=1 \
              --mount "type=bind,src=${RUNNER_TEMP}/padm-contracts-source.tar,dst=/snapshot.tar,readonly" \
              padm-regression:contracts "${SELECTOR}"
          else
            sudo env TMPDIR=/tmp PADM_REGRESSION_PARALLEL_JOBS=2 PADM_DOCKER_CONTRACTS_SHARED_CHECKS="${PADM_DOCKER_CONTRACTS_SHARED_CHECKS}" bash shell/subscription_groups_regression.sh "${SELECTOR}"
          fi
