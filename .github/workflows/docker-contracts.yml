name: Docker Contracts

on:
  workflow_call:
    inputs:
      source_ref:
        description: Full source commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  contracts:
    name: Docker contracts (${{ matrix.selector }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PADM_DOCKER_CONTRACTS_SHARED_CHECKS: '1'
      # 协议分片包含控制日志测试，日志路径的全部祖先必须归 root 所有。
      CONTRACT_TOOLS: ${{ startsWith(matrix.selector, 'docker-contracts-fast-') || startsWith(matrix.selector, 'docker-contracts-reality-') || matrix.selector == 'docker-contracts-phase3-protocol' }}
    strategy:
      fail-fast: true
      # 留出原生与 TLS 门禁的两个槽位，避免长分片排队。
      max-parallel: 18
      matrix:
        selector:
          - docker-port-hopping-preflight
          - docker-contracts-fast-rest
          - docker-recovery-apply
          - docker-xhttp-edit
          - docker-contracts-phase3-protocol
          - docker-contracts-phase3-tls
          - docker-contracts-phase3-topology
          - docker-contracts-setup-transports
          - docker-contracts-fast-heavy
          - docker-contracts-fast-sites
          - docker-contracts-system-light
          - docker-contracts-setup-basic
          - docker-contracts-reality-metadata
          - docker-contracts-reality-rotation
          - docker-routing-ip-ownership
          - docker-routing-dns-csv
          - docker-contracts-policy
          - docker-routing-core-network
    steps:
      - name: Checkout checked source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
      - name: Install pinned jq
        if: env.CONTRACT_TOOLS != 'true'
        run: sudo bash shell/regression/install-ci-jq.sh
      - name: Prepare native schema validator
        if: env.CONTRACT_TOOLS != 'true'
        shell: bash
        run: |
          if ! sudo python3 -c 'import jsonschema'; then
            sudo apt-get update
            sudo apt-get install -y python3-jsonschema
            sudo python3 -c 'import jsonschema'
          fi
      - name: Cache contract tools
        if: env.CONTRACT_TOOLS == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/padm-contract-tools.tar
          key: padm-contract-tools-contracts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell/regression/container/Dockerfile', 'shell/regression/container/entrypoint.sh') }}
      - name: Prepare control and site contract tools
        if: env.CONTRACT_TOOLS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/padm-contract-tools.tar"
          if [[ -f "${tools}" ]]; then
            docker load --input "${tools}"
          else
            for attempt in 1 2 3; do
              if docker build --target contracts --tag padm-regression:contracts shell/regression/container; then
                break
              fi
              if [[ "${attempt}" -eq 3 ]]; then
                exit 1
              fi
              sleep $((attempt * 10))
            done
            docker save --output "${tools}" padm-regression:contracts
          fi
      - name: Run contract shard
        shell: bash
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          set -euo pipefail
          jobs=2
          if [[ "${SELECTOR}" == docker-contracts-fast-rest ]]; then jobs=4; fi
          if [[ "${SELECTOR}" == docker-contracts-setup-basic || "${SELECTOR}" == docker-contracts-system-light || "${SELECTOR}" == docker-routing-dns-csv ]]; then jobs=3; fi
          if [[ "${SELECTOR}" == docker-port-hopping-preflight ]]; then
            sudo env TMPDIR=/tmp PADM_DOCKER_CONTRACTS_SHARED_CHECKS="${PADM_DOCKER_CONTRACTS_SHARED_CHECKS}" bash -s -- "${SELECTOR}" <<'SH'
          set -euo pipefail
          source shell/regression/container/snapshot-fork-runtime.sh
          trap 'if [[ -n "${PADM_SNAPSHOT_FORK_PID:-}" ]]; then kill "${PADM_SNAPSHOT_FORK_PID}" 2>/dev/null || true; wait "${PADM_SNAPSHOT_FORK_PID}" 2>/dev/null || true; fi' EXIT
          if ! padmSnapshotForkStart; then
            printf 'snapshot fork adapter 启动失败，使用原 Python 入口\n' >&2
            unset PADM_SNAPSHOT_FORK_CLIENT PADM_SNAPSHOT_FORK_SOCKET PADM_SNAPSHOT_FORK_PID
          fi
          bash shell/subscription_groups_regression.sh "$1"
          SH
          # ML-KEM 配对校验需要工具镜像中的 OpenSSL 3.5，不能使用旧版 runner 工具。
          elif [[ "${CONTRACT_TOOLS}" == true ]]; then
            git ls-files -z | tar --null -T - -cf "${RUNNER_TEMP}/padm-contracts-source.tar"
            permissions=()
            if [[ "${SELECTOR}" == docker-contracts-fast-rest ]]; then
              # SSH driver 和 guard 夹具需要 ptrace 及容器私有挂载空间。
              # Ubuntu 默认 AppArmor 拒绝 mount，只有该分片放开此限制。
              permissions=(--cap-add SYS_PTRACE --cap-add SYS_ADMIN --security-opt apparmor=unconfined)
            fi
            docker run --rm --network none --init \
              "${permissions[@]}" \
              --tmpfs /work:rw,exec,mode=0755 --tmpfs /tmp:rw,exec,mode=1777 \
              --env PADM_REGRESSION_PARALLEL_JOBS="${jobs}" \
              --env PADM_DOCKER_CONTRACTS_SHARED_CHECKS \
              --env PADM_REGRESSION_VERBOSE=1 \
              --mount "type=bind,src=${RUNNER_TEMP}/padm-contracts-source.tar,dst=/snapshot.tar,readonly" \
              padm-regression:contracts "${SELECTOR}"
          else
            sudo env TMPDIR=/tmp PADM_REGRESSION_PARALLEL_JOBS="${jobs}" PADM_DOCKER_CONTRACTS_SHARED_CHECKS="${PADM_DOCKER_CONTRACTS_SHARED_CHECKS}" bash shell/subscription_groups_regression.sh "${SELECTOR}"
          fi
