name: Docker Contracts

on:
  workflow_call:
    inputs:
      source_ref:
        description: Full source commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  contracts:
    name: Docker contracts (${{ matrix.selector }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PADM_DOCKER_CONTRACTS_SHARED_CHECKS: '1'
    strategy:
      fail-fast: true
      # 留出原生与 TLS 门禁的两个槽位，避免长分片排队。
      max-parallel: 18
      matrix:
        selector:
          - docker-contracts-fast-rest
          - docker-phase3
          - docker-reality-targets-direct
          - docker-reality-targets-selection
          - docker-traditional-tls
          - docker-setup-transports
          - docker-contracts-fast-heavy
          - docker-phase4-maintenance
          - docker-contracts-system-light
          - docker-setup-encrypted-udp
          - docker-contracts-setup-basic
          - docker-contracts-reality-metadata
          - docker-reality
          - docker-setup-tls
          - docker-routing-direct-block-workflow
          - docker-routing-dns-hosts-workflow
          - docker-routing-core-policy-lifecycle
          - docker-routing-core-network
    steps:
      - name: Checkout checked source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
      - name: Prepare control and site contract tools
        if: startsWith(matrix.selector, 'docker-contracts-fast-') || startsWith(matrix.selector, 'docker-routing-')
        shell: bash
        run: |
          docker build --tag padm-regression:contracts shell/regression/container
      - name: Run contract shard
        shell: bash
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          set -euo pipefail
          if [[ "${SELECTOR}" == docker-contracts-fast-* || "${SELECTOR}" == docker-routing-* ]]; then
            jobs=2
            if [[ "${SELECTOR}" == docker-contracts-fast-* ]]; then jobs=4; fi
            git ls-files -z | tar --null -T - -cf "${RUNNER_TEMP}/padm-contracts-source.tar"
            docker run --rm --network none --init \
              --env PADM_REGRESSION_PARALLEL_JOBS="${jobs}" \
              --env PADM_DOCKER_CONTRACTS_SHARED_CHECKS \
              --mount "type=bind,src=${RUNNER_TEMP}/padm-contracts-source.tar,dst=/snapshot.tar,readonly" \
              padm-regression:contracts "${SELECTOR}"
          else
            sudo env TMPDIR=/tmp PADM_REGRESSION_PARALLEL_JOBS=2 PADM_DOCKER_CONTRACTS_SHARED_CHECKS="${PADM_DOCKER_CONTRACTS_SHARED_CHECKS}" bash shell/subscription_groups_regression.sh "${SELECTOR}"
          fi
