name: Build Docker Images

on:
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string
      source_ref:
        description: Full source commit to build
        required: true
        type: string
      registry:
        description: OCI registry hostname and namespace
        required: true
        type: string
      push:
        description: Push and sign release images
        required: true
        type: boolean
      contracts_only:
        description: Validate contracts without building or publishing images
        default: false
        type: boolean
    outputs:
      artifact_name:
        description: Release assets artifact produced after image publication
        value: ${{ jobs.assemble.outputs.artifact_name }}
      manifest_sha256:
        description: SHA-256 of release-manifest.json
        value: ${{ jobs.assemble.outputs.manifest_sha256 }}

jobs:
  contract:
    name: Docker contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.plan.outputs.images }}
      registry_host: ${{ steps.plan.outputs.registry_host }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Validate lock, schemas and contracts
        shell: bash
        run: |
          set -euo pipefail
          bash docker/release.sh validate-lock
          bash -n install-docker.sh docker/release.sh docker/tests/image-smoke.sh
          jq empty docker/contracts/*.json
          bash docker/tests/phase1.sh
          bash docker/tests/phase2.sh
          bash docker/tests/phase3.sh
          bash docker/tests/phase4.sh
          bash docker/tests/phase5.sh
          bash docker/tests/phase6.sh
          bash docker/tests/traffic.sh

      - name: Install Cosign
        if: ${{ !inputs.contracts_only }}
        uses: sigstore/cosign-installer@v4.1.2

      - name: Resolve changed image inputs
        id: plan
        if: ${{ !inputs.contracts_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PADM_REGISTRY: ${{ inputs.registry }}
          PADM_COSIGN_IDENTITY_REGEX: https://github.com/${{ github.repository }}/.github/workflows/.*@refs/heads/main
        run: |
          set -euo pipefail
          previous="${RUNNER_TEMP}/previous-release"
          mkdir -p "${previous}"
          baseline=
          # 只有验签且可追溯到当前提交的发布记录才能作为复用基线。
          if gh release download --repo "${GITHUB_REPOSITORY}" --dir "${previous}" \
              --pattern release-manifest.json --pattern release-manifest.sigstore.json &&
            cosign verify-blob --bundle "${previous}/release-manifest.sigstore.json" \
              --certificate-identity-regexp "${PADM_COSIGN_IDENTITY_REGEX}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${previous}/release-manifest.json" &&
            bash docker/release.sh validate-manifest "${previous}/release-manifest.json"; then
            baseline=$(jq -r '.release.commit' "${previous}/release-manifest.json")
          else
            echo '::notice::No verified release baseline; all images will be rebuilt.'
          fi
          images='[]'
          for name in xray sing-box nginx ops net; do
            reference=
            if [[ -n "${baseline}" ]] &&
              bash docker/release.sh image-inputs-unchanged "${baseline}" HEAD "${name}"; then
              reference=$(jq -r --arg name "${name}" '.images[$name].reference' "${previous}/release-manifest.json")
              if [[ "${reference}" != "${PADM_REGISTRY}/padm-${name}:"* ]]; then
                reference=
              fi
            fi
            images=$(jq -c --arg name "${name}" --arg reference "${reference}" \
              '. + [{name: $name, reference: $reference}]' <<<"${images}")
            printf '%s: %s\n' "${name}" "${reference:-rebuild}" >>"${GITHUB_STEP_SUMMARY}"
          done
          echo "images=${images}" >>"${GITHUB_OUTPUT}"
          echo "registry_host=${PADM_REGISTRY%%/*}" >>"${GITHUB_OUTPUT}"

  smoke:
    name: Smoke ${{ matrix.image.name }} (${{ matrix.platform.name }})
    needs: contract
    if: ${{ !inputs.contracts_only }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJSON(needs.contract.outputs.images) }}
        platform:
          - name: amd64
            value: linux/amd64
          - name: arm64
            value: linux/arm64
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ${{ needs.contract.outputs.registry_host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export locked build inputs
        if: ${{ matrix.image.reference == '' }}
        shell: bash
        run: grep '^PADM_LOCK_[A-Z0-9_]*=' versions.lock >>"${GITHUB_ENV}"

      - name: Build one platform
        id: build
        if: ${{ matrix.image.reference == '' }}
        uses: docker/bake-action@v7
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_TAG: ${{ inputs.version }}
          GIT_REVISION: ${{ inputs.source_ref }}
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          source: .
          targets: ${{ matrix.image.name }}
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}
          set: |
            ${{ matrix.image.name }}.platform=${{ matrix.platform.value }}
            ${{ matrix.image.name }}.tags=${{ inputs.push && format('{0}/padm-{1}', inputs.registry, matrix.image.name) || format('{0}/padm-{1}:{2}', inputs.registry, matrix.image.name, inputs.version) }}
            ${{ matrix.image.name }}.args.PADM_VERSION=${{ inputs.version }}
            ${{ matrix.image.name }}.output=${{ inputs.push && 'type=image,push-by-digest=true,name-canonical=true,push=true' || 'type=docker' }}
            ${{ matrix.image.name }}.cache-from=type=gha,scope=padm-${{ matrix.image.name }}-${{ matrix.platform.name }}
            ${{ matrix.image.name }}.cache-to=type=gha,mode=max,scope=padm-${{ matrix.image.name }}-${{ matrix.platform.name }}

      - name: Test the exact image
        shell: bash
        env:
          PADM_RELEASE_VERSION: ${{ inputs.version }}
          PADM_REGISTRY: ${{ inputs.registry }}
          PADM_IMAGE_NAME: ${{ matrix.image.name }}
          PADM_PLATFORM: ${{ matrix.platform.value }}
          PADM_PLATFORM_NAME: ${{ matrix.platform.name }}
          PADM_PREVIOUS_REFERENCE: ${{ matrix.image.reference }}
          PADM_PUSH: ${{ inputs.push }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform.value }}
        run: |
          set -euo pipefail
          repository="${PADM_REGISTRY}/padm-${PADM_IMAGE_NAME}"
          smoke_ref="${repository}:${PADM_RELEASE_VERSION}"
          if [[ -n "${PADM_PREVIOUS_REFERENCE}" ]]; then
            smoke_ref=${PADM_PREVIOUS_REFERENCE}
          elif [[ "${PADM_PUSH}" == true ]]; then
            digest=$(jq -er --arg name "${PADM_IMAGE_NAME}" \
              '.[$name]["containerimage.digest"] | select(test("^sha256:[0-9a-f]{64}$"))' <<<"${BUILD_METADATA}")
            smoke_ref="${repository}@${digest}"
          fi
          if [[ -n "${PADM_PREVIOUS_REFERENCE}" || "${PADM_PUSH}" == true ]]; then
            docker pull --platform "${PADM_PLATFORM}" "${smoke_ref}"
          fi
          bash docker/tests/image-smoke.sh "${smoke_ref}" "${PADM_IMAGE_NAME}"
          if [[ "${PADM_PUSH}" == true && -z "${PADM_PREVIOUS_REFERENCE}" ]]; then
            platform_digest=$(docker buildx imagetools inspect "${smoke_ref}" --raw |
              jq -er --arg arch "${PADM_PLATFORM_NAME}" \
                '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] |
                 if length == 1 then .[0].digest else error("Invalid platform index") end')
            jq -n --arg digest "${digest}" --arg platform_digest "${platform_digest}" \
              '{digest: $digest, platform_digest: $platform_digest}' \
              >"${RUNNER_TEMP}/${PADM_IMAGE_NAME}-${PADM_PLATFORM_NAME}.json"
          fi

      - name: Upload tested platform digest
        if: ${{ inputs.push && matrix.image.reference == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: padm-platform-${{ matrix.image.name }}-${{ matrix.platform.name }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/${{ matrix.image.name }}-${{ matrix.platform.name }}.json

  publish:
    name: Publish ${{ matrix.image.name }}
    if: ${{ inputs.push && !inputs.contracts_only }}
    needs: [contract, smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJSON(needs.contract.outputs.images) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ needs.contract.outputs.registry_host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Download tested platform digests
        if: ${{ matrix.image.reference == '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: padm-platform-${{ matrix.image.name }}-*-${{ github.run_id }}
          path: ${{ runner.temp }}/platforms
          merge-multiple: true

      - name: Merge tested images or reuse signed index
        id: image
        shell: bash
        env:
          PADM_RELEASE_VERSION: ${{ inputs.version }}
          PADM_REGISTRY: ${{ inputs.registry }}
          PADM_IMAGE_NAME: ${{ matrix.image.name }}
          PADM_PREVIOUS_REFERENCE: ${{ matrix.image.reference }}
          PADM_COSIGN_IDENTITY_REGEX: https://github.com/${{ github.repository }}/.github/workflows/.*@refs/heads/main
          PADM_COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          image_ref="${PADM_REGISTRY}/padm-${PADM_IMAGE_NAME}:${PADM_RELEASE_VERSION}"
          raw_file="${RUNNER_TEMP}/imagetools-${PADM_IMAGE_NAME}.json"
          if [[ -n "${PADM_PREVIOUS_REFERENCE}" ]]; then
            image_ref=${PADM_PREVIOUS_REFERENCE%@*}
            index_digest=${PADM_PREVIOUS_REFERENCE##*@}
          else
            refs=()
            for arch in amd64 arm64; do
              result="${RUNNER_TEMP}/platforms/${PADM_IMAGE_NAME}-${arch}.json"
              digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' "${result}")
              refs+=("${PADM_REGISTRY}/padm-${PADM_IMAGE_NAME}@${digest}")
            done
            docker buildx imagetools create --tag "${image_ref}" "${refs[@]}"
            index_digest=$(docker buildx imagetools inspect "${image_ref}" |
              sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)
          fi
          [[ "${index_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Unable to resolve index digest" >&2
            exit 1
          }
          docker buildx imagetools inspect "${image_ref}@${index_digest}" --raw >"${raw_file}"
          jq -e '
            [.manifests[]? | select(.platform.os == "linux" and
              (.platform.architecture == "amd64" or .platform.architecture == "arm64"))] |
            length == 2 and (map(.platform.architecture) | sort) == ["amd64", "arm64"] and
            all(.[]; .digest | test("^sha256:[0-9a-f]{64}$"))
          ' "${raw_file}" >/dev/null
          jq -e '
            . as $index |
            all(.manifests[] | select(.platform.os == "linux");
              .digest as $digest | any($index.manifests[];
                .annotations["vnd.docker.reference.type"] == "attestation-manifest" and
                .annotations["vnd.docker.reference.digest"] == $digest))
          ' "${raw_file}" >/dev/null
          if [[ -z "${PADM_PREVIOUS_REFERENCE}" ]]; then
            jq -e --slurpfile amd64 "${RUNNER_TEMP}/platforms/${PADM_IMAGE_NAME}-amd64.json" \
              --slurpfile arm64 "${RUNNER_TEMP}/platforms/${PADM_IMAGE_NAME}-arm64.json" '
              [.manifests[] | select(.platform.os == "linux") | {key: .platform.architecture, value: .digest}] |
              from_entries == {amd64: $amd64[0].platform_digest, arm64: $arm64[0].platform_digest}
            ' "${raw_file}" >/dev/null
            cosign sign --yes "${image_ref}@${index_digest}"
          fi
          cosign verify "${image_ref}@${index_digest}" \
            --certificate-identity-regexp "${PADM_COSIGN_IDENTITY_REGEX}" \
            --certificate-oidc-issuer "${PADM_COSIGN_OIDC_ISSUER}" \
            >"${RUNNER_TEMP}/cosign-${PADM_IMAGE_NAME}.json"
          jq -n \
            --arg name "${PADM_IMAGE_NAME}" \
            --arg reference "${image_ref}@${index_digest}" \
            --arg index_digest "${index_digest}" \
            --slurpfile raw "${raw_file}" \
            '{name: $name, reference: $reference, index_digest: $index_digest,
              platforms: ([$raw[0].manifests[]? |
                select(.platform.os == "linux" and
                  (.platform.architecture == "amd64" or .platform.architecture == "arm64")) |
                {key: ("linux/" + .platform.architecture), value: .digest}] | from_entries)}' \
            >"${RUNNER_TEMP}/${PADM_IMAGE_NAME}.json"

      - name: Upload image evidence
        uses: actions/upload-artifact@v7
        with:
          name: padm-image-${{ matrix.image.name }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/${{ matrix.image.name }}.json
            ${{ runner.temp }}/imagetools-${{ matrix.image.name }}.json
            ${{ runner.temp }}/cosign-${{ matrix.image.name }}.json

  assemble:
    name: Assemble release assets
    if: ${{ inputs.push && !inputs.contracts_only }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.output.outputs.artifact_name }}
      manifest_sha256: ${{ steps.output.outputs.manifest_sha256 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Download image evidence
        uses: actions/download-artifact@v8
        with:
          pattern: padm-image-*-${{ github.run_id }}
          path: ${{ runner.temp }}/image-results
          merge-multiple: true

      - name: Build control bundle and release manifest
        id: manifest
        shell: bash
        env:
          PADM_RELEASE_VERSION: ${{ inputs.version }}
          PADM_SOURCE_REF: ${{ inputs.source_ref }}
          PADM_REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          assets="${RUNNER_TEMP}/release-assets"
          mkdir -p "${assets}"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf - \
            install-docker.sh docker shell/core/deployment_mode.sh shell/core/stats_grpc.sh versions.lock docker-bake.hcl \
            documents/docker*.md | gzip -n >"${assets}/padm-docker-bundle.tar.gz"
          bundle_sha256=$(sha256sum "${assets}/padm-docker-bundle.tar.gz" | cut -d ' ' -f 1)
          bundle_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${PADM_RELEASE_VERSION}/padm-docker-bundle.tar.gz"
          bash docker/release.sh manifest \
            --version "${PADM_RELEASE_VERSION}" \
            --commit "${PADM_SOURCE_REF}" \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --registry "${PADM_REGISTRY}" \
            --bundle-url "${bundle_url}" \
            --bundle-sha256 "${bundle_sha256}" \
            --results-dir "${RUNNER_TEMP}/image-results" \
            --output "${assets}/release-manifest.json"

      - name: Expose release artifact metadata
        id: output
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="padm-release-assets-${GITHUB_RUN_ID}"
          manifest_sha256=$(sha256sum "${RUNNER_TEMP}/release-assets/release-manifest.json" | cut -d ' ' -f 1)
          echo "artifact_name=${artifact_name}" >>"${GITHUB_OUTPUT}"
          echo "manifest_sha256=${manifest_sha256}" >>"${GITHUB_OUTPUT}"

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v7
        with:
          name: padm-release-assets-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/release-assets
