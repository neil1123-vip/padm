name: Build sing-box Traffic Stats

on:
  workflow_call:
    inputs:
      version:
        description: 'sing-box tag or supported padm revision to build'
        required: true
        type: string
      publish:
        description: 'Publish a missing release after verification'
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'versions.lock'
      - '.github/workflows/build-sing-box.yml'
      - 'shell/build-sing-box.sh'
      - 'shell/core/singbox_build.sh'
      - 'shell/subscription/traffic.sh'
      - 'shell/core/stats_grpc.sh'
      - 'docker-bake.hcl'
      - 'docker/images/sing-box/**'
      - 'docker/tests/image-smoke.sh'
      - 'docker/tests/sing-box-build.cjs'
      - 'docker/tests/reality-real.sh'
      - 'docker/tests/reality-key-share-real.sh'
      - 'docker/tests/reality-key-share-real_test.go'
      - 'docker/tests/reality-hybrid-only-real_test.go'
      - 'shell/regression/container/**'
      - 'shell/regression/install-ci-jq.sh'
  workflow_dispatch:
    inputs:
      version:
        description: 'sing-box tag or padm revision (empty uses versions.lock)'
        required: false
        type: string
      publish:
        description: 'Publish a missing release after verification'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: padm-sing-box-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  prepare:
    name: Resolve and verify sing-box
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      skip: ${{ steps.resolve.outputs.skip || 'true' }}
      publish: ${{ steps.resolve.outputs.publish || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check build workflow decisions
        run: node docker/tests/sing-box-build.cjs
      - name: Detect sing-box build input changes
        id: inputs
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed=true
          verify=false
          [[ "${GITHUB_EVENT_NAME}" != push && "${GITHUB_EVENT_NAME}" != workflow_dispatch ]] || verify=true
          if [[ "${GITHUB_EVENT_NAME}" == push && "${BEFORE_SHA}" =~ ^[0-9a-f]{40}$ &&
            "${BEFORE_SHA}" != 0000000000000000000000000000000000000000 ]] &&
            git cat-file -e "${BEFORE_SHA}:versions.lock"; then
            if git diff --quiet "${BEFORE_SHA}" HEAD -- .github/workflows/build-sing-box.yml shell/build-sing-box.sh shell/core/singbox_build.sh \
              shell/subscription/traffic.sh shell/core/stats_grpc.sh docker-bake.hcl docker/images/sing-box \
              docker/tests/image-smoke.sh docker/tests/sing-box-build.cjs docker/tests/reality-real.sh \
              docker/tests/reality-key-share-real.sh docker/tests/reality-key-share-real_test.go \
              docker/tests/reality-hybrid-only-real_test.go shell/regression/container shell/regression/install-ci-jq.sh; then
              runtime_keys='^PADM_LOCK_(ALPINE_BASE|CA_CERTIFICATES_VERSION|GCOMPAT_VERSION|LIBGCC_VERSION)='
              previous=$(git show "${BEFORE_SHA}:versions.lock" | grep -E "${runtime_keys}")
              current=$(grep -E "${runtime_keys}" versions.lock)
              [[ "${previous}" != "${current}" ]] || verify=false
              build_keys='^PADM_LOCK_SING_BOX_(VERSION|AMD64_UPSTREAM_SHA256|ARM64_UPSTREAM_SHA256)='
              previous=$(git show "${BEFORE_SHA}:versions.lock" | grep -E "${build_keys}")
              current=$(grep -E "${build_keys}" versions.lock)
              if [[ "${previous}" != "${current}" ]]; then
                previous_version=$(git show "${BEFORE_SHA}:versions.lock" | grep '^PADM_LOCK_SING_BOX_VERSION=')
                [[ "${previous_version}" != "$(grep '^PADM_LOCK_SING_BOX_VERSION=' versions.lock)" ]] || verify=true
              else
                [[ "${verify}" == true ]] || changed=false
              fi
            fi
          fi
          printf 'changed=%s\nverify=%s\n' "${changed}" "${verify}" >>"${GITHUB_OUTPUT}"
      - name: Read version lock
        if: steps.inputs.outputs.changed == 'true'
        id: lock
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          . ./versions.lock
          . ./shell/core/singbox_build.sh
          version=$(singBoxBuildVersion "${REQUESTED_VERSION:-${PADM_LOCK_SING_BOX_VERSION}}")
          upstream=$(singBoxUpstreamVersion "${version}")
          printf 'version=%s\nupstream=%s\nlock_version=%s\namd64=%s\narm64=%s\n' \
            "${version}" "${upstream}" "${PADM_LOCK_SING_BOX_VERSION}" \
            "${PADM_LOCK_SING_BOX_AMD64_UPSTREAM_SHA256}" "${PADM_LOCK_SING_BOX_ARM64_UPSTREAM_SHA256}" >>"${GITHUB_OUTPUT}"

      - name: Preflight pinned Alpine dependencies
        if: steps.inputs.outputs.changed == 'true'
        shell: bash
        run: bash docker/release.sh preflight

      - name: Resolve immutable source and release assets
        if: steps.inputs.outputs.changed == 'true'
        id: resolve
        uses: actions/github-script@v9
        env:
          BUILD_VERSION: ${{ steps.lock.outputs.version }}
          UPSTREAM_VERSION: ${{ steps.lock.outputs.upstream }}
          LOCK_VERSION: ${{ steps.lock.outputs.lock_version }}
          LOCK_AMD64: ${{ steps.lock.outputs.amd64 }}
          LOCK_ARM64: ${{ steps.lock.outputs.arm64 }}
          VERIFY_EXISTING: ${{ steps.inputs.outputs.verify }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        with:
          script: |
            const version = process.env.BUILD_VERSION;
            const upstreamVersion = process.env.UPSTREAM_VERSION;
            if (!/^v\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+|-padm\.[1-9]\d*)?$/.test(version) ||
                !/^v\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?$/.test(upstreamVersion) ||
                version.replace(/-padm\.\d+$/, '') !== upstreamVersion) {
              throw new Error(`Unsupported build/upstream version: ${version}/${upstreamVersion}`);
            }
            const base = `sing-box-${version.slice(1)}`;
            const tag = `sing-box-${version}`;
            const existing = await github.rest.repos.getReleaseByTag({ ...context.repo, tag })
              .then(({ data }) => data).catch(error => {
                if (error.status === 404) return null;
                throw error;
              });
            const required = [`${base}-linux-amd64.tar.gz`, `${base}-linux-arm64.tar.gz`, `${base}-source.tar.gz`, 'SHA256SUMS'];
            const complete = existing && !existing.draft && required.every(name => existing.assets.filter(asset =>
              asset.name === name && asset.size > 0 && /^sha256:[0-9a-f]{64}$/.test(asset.digest || '')).length === 1);
            if (existing && !existing.draft && !complete) throw new Error('Published release is incomplete; repair it explicitly');
            core.setOutput('version', version);
            const publish = process.env.EVENT_NAME === 'push' || process.env.PUBLISH_RELEASE === 'true';
            core.setOutput('publish', !complete && publish ? 'true' : 'false');
            const skip = complete && process.env.VERIFY_EXISTING !== 'true';
            core.setOutput('skip', skip ? 'true' : 'false');
            if (skip) return;
            const upstream = { owner: 'SagerNet', repo: 'sing-box' };
            let { data: { object } } = await github.rest.git.getRef({ ...upstream, ref: `tags/${upstreamVersion}` });
            for (let depth = 0; object.type === 'tag' && depth < 5; depth++) {
              ({ data: { object } } = await github.rest.git.getTag({ ...upstream, tag_sha: object.sha }));
            }
            if (object.type !== 'commit' || !/^[0-9a-f]{40}$/.test(object.sha)) {
              throw new Error('Upstream tag did not resolve to a commit');
            }
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...upstream, tag: upstreamVersion });
            if (release.draft || release.tag_name !== upstreamVersion) throw new Error('Upstream release is unavailable');
            const upstreamBase = `sing-box-${upstreamVersion.slice(1)}`;
            const matrix = { include: ['amd64', 'arm64'].map(arch => {
              const assets = release.assets.filter(asset => asset.name === `${upstreamBase}-linux-${arch}.tar.gz`);
              if (assets.length !== 1 || !/^sha256:[0-9a-f]{64}$/.test(assets[0].digest || '') || assets[0].size <= 0) {
                throw new Error(`Missing verified upstream asset for ${arch}`);
              }
              const sha256 = assets[0].digest.slice(7);
              if (upstreamVersion === process.env.LOCK_VERSION.replace(/-padm\.\d+$/, '') &&
                  sha256 !== process.env[`LOCK_${arch.toUpperCase()}`]) {
                throw new Error(`Upstream ${arch} digest differs from versions.lock`);
              }
              return { arch, runner: arch === 'amd64' ? 'ubuntu-latest' : 'ubuntu-24.04-arm', sha256 };
            }) };
            core.setOutput('commit', object.sha);
            core.setOutput('matrix', JSON.stringify(matrix));

  build:
    name: Build sing-box (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned upstream source
        uses: actions/checkout@v7
        with:
          repository: SagerNet/sing-box
          ref: ${{ needs.prepare.outputs.commit }}
          path: .tmp-sing-box-source
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tmp-sing-box-source/go.mod
          cache-dependency-path: .tmp-sing-box-source/go.sum
      - name: Build and verify native binary
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          ARCH: ${{ matrix.arch }}
          UPSTREAM_SHA256: ${{ matrix.sha256 }}
        run: |
          bash shell/build-sing-box.sh "${VERSION}" "${COMMIT}" "${ARCH}" \
            .tmp-sing-box-source .tmp-sing-box-artifacts "${UPSTREAM_SHA256}"
      - uses: docker/setup-buildx-action@v4
      - name: Verify candidate in the Alpine image
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          set -a
          . ./versions.lock
          set +a
          mkdir -p .tmp-sing-box-image/out
          tar -xzf ".tmp-sing-box-artifacts/sing-box-${VERSION#v}-linux-${ARCH}.tar.gz" \
            --strip-components=1 -C .tmp-sing-box-image/out
          # 用本次候选包覆盖下载阶段，运行层与正式镜像共用 Dockerfile 和锁定依赖。
          docker buildx bake --file docker-bake.hcl sing-box --load \
            --set "sing-box.platform=linux/${ARCH}" \
            --set 'sing-box.contexts.fetch=.tmp-sing-box-image' \
            --set "sing-box.args.SING_BOX_VERSION=${VERSION}" \
            --set "sing-box.args.VCS_REF=${GITHUB_SHA}" \
            --set "sing-box.tags=padm-sing-box-candidate:${ARCH}"
          bash docker/tests/image-smoke.sh "padm-sing-box-candidate:${ARCH}" sing-box
      - name: Verify native Reality candidate
        if: needs.prepare.outputs.version == 'v1.14.4-padm.2'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          XRAY_IMAGE: ghcr.io/neil1123-vip/padm-xray@sha256:0f768569d91783b640b911da2956c7db5f3d4607852a8489968c3a571cd45bf7
          OPS_IMAGE: ghcr.io/neil1123-vip/padm-ops@sha256:3f00355db580fabb2c9eaea8c1cd8fcd43f286acc6bf9499e12870cec03d20a1
        run: |
          set -euo pipefail
          docker pull --platform "linux/${ARCH}" "${XRAY_IMAGE}"
          docker pull --platform "linux/${ARCH}" "${OPS_IMAGE}"
          sudo bash shell/regression/install-ci-jq.sh
          # 原整轮使用本次交付镜像与固定配对，不修改候选二进制或指纹。
          sudo env TMPDIR="${RUNNER_TEMP}" bash docker/tests/reality-real.sh \
            "${XRAY_IMAGE}" "padm-sing-box-candidate:${ARCH}" "${OPS_IMAGE}" mldsa65
      - name: Verify fixed Reality key shares
        if: needs.prepare.outputs.version == 'v1.14.4-padm.2'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          XRAY_IMAGE: ghcr.io/neil1123-vip/padm-xray@sha256:0f768569d91783b640b911da2956c7db5f3d4607852a8489968c3a571cd45bf7
        run: |
          set -euo pipefail
          docker build --platform "linux/${ARCH}" --target contracts \
            --tag padm-regression:contracts shell/regression/container
          git ls-files -z | tar --null -T - -cf "${RUNNER_TEMP}/reality-source.tar"
          mkdir -p "${RUNNER_TEMP}/reality-xray"
          extractor=$(docker create --network none "${XRAY_IMAGE}")
          trap 'docker rm --volumes "${extractor}"' EXIT
          docker cp "${extractor}:/usr/local/bin/xray" "${RUNNER_TEMP}/reality-xray/xray"
          # 测试容器内解包当前源码；只读复用本次构建的固定上游、工具链和模块下载缓存。
          docker run --rm --network bridge --init \
            --env PADM_REGRESSION_PARALLEL_JOBS=2 --env PADM_REGRESSION_VERBOSE=1 \
            --mount "type=bind,src=${RUNNER_TEMP}/reality-source.tar,dst=/snapshot.tar,readonly" \
            --mount "type=bind,src=${PWD}/.tmp-sing-box-source,dst=/sing-box-build-cache/upstream-v1.14.4,readonly" \
            --mount "type=bind,src=$(go env GOROOT),dst=/sing-box-build-cache/go,readonly" \
            --mount "type=bind,src=$(go env GOMODCACHE),dst=/sing-box-build-cache/gopath/pkg/mod,readonly" \
            --mount "type=bind,src=${RUNNER_TEMP}/reality-xray,dst=/routing-cores,readonly" \
            padm-regression:contracts docker-reality-hybrid-only-real
      - uses: actions/upload-artifact@v7
        with:
          name: sing-box-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          path: .tmp-sing-box-artifacts/*.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish sing-box release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sing-box-${{ needs.prepare.outputs.version }}-*
          path: .tmp-sing-box-release
          merge-multiple: true
      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          cd .tmp-sing-box-release
          base="sing-box-${VERSION#v}"
          assets=("${base}-linux-amd64.tar.gz" "${base}-linux-arm64.tar.gz" "${base}-source.tar.gz")
          for asset in "${assets[@]}"; do [[ -s "${asset}" ]]; done
          sha256sum "${assets[@]}" >SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          assets+=(SHA256SUMS)
          tag="sing-box-${VERSION}"
          prerelease=false
          [[ "${VERSION%-padm.*}" != *-* ]] || prerelease=true
          printf '%s\n\n%s\n%s\n%s\n' \
            "sing-box ${VERSION} with per-user traffic statistics for padm." \
            "Source: https://github.com/SagerNet/sing-box/tree/${SOURCE_COMMIT}" \
            'Build: upstream default tags plus with_purego and with_v2ray_api; CGO_ENABLED=0.' \
            "Corresponding source: ${base}-source.tar.gz. Binary archives include LICENSE and BUILD_INFO.json." >notes.txt
          gh api "repos/${GH_REPO}/releases?per_page=100" --paginate --slurp >releases.json
          release_id=$(jq -r --arg tag "${tag}" '
            [.[][] | select(.tag_name == $tag)] |
            if length > 1 then error("Duplicate release tags") else .[0].id // "" end
          ' releases.json)
          if [[ -z "${release_id}" ]]; then
            release_id=$(gh api --method POST "repos/${GH_REPO}/releases" \
              -f tag_name="${tag}" -f target_commitish="${GITHUB_SHA}" \
              -f name="sing-box ${VERSION} (padm traffic stats)" -F draft=true \
              -F prerelease="${prerelease}" -f make_latest=false -F body=@notes.txt --jq .id)
          fi
          [[ "${release_id}" =~ ^[0-9]+$ ]]
          gh api "repos/${GH_REPO}/releases/${release_id}" >release.json
          jq -e --arg tag "${tag}" --argjson id "${release_id}" \
            '.id == $id and .tag_name == $tag and .draft == true' release.json >/dev/null
          gh release upload "${tag}" "${assets[@]}" --clobber
          gh api "repos/${GH_REPO}/releases/${release_id}" >release.json
          jq -e --arg tag "${tag}" --argjson id "${release_id}" \
            '.id == $id and .tag_name == $tag and .draft == true' release.json >/dev/null
          for asset in "${assets[@]}"; do
            digest="sha256:$(sha256sum "${asset}" | cut -d ' ' -f 1)"
            jq -e --arg name "${asset}" --arg digest "${digest}" \
              '[.assets[] | select(.name == $name and .digest == $digest and .size > 0)] | length == 1' release.json >/dev/null
          done
          gh api --method PATCH "repos/${GH_REPO}/releases/${release_id}" \
            -f tag_name="${tag}" -F draft=false -f make_latest=false -F prerelease="${prerelease}" -F body=@notes.txt --silent
