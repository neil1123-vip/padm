name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read script version
        id: version
        shell: bash
        run: |
          PROJECT_ROOT="$GITHUB_WORKSPACE"
          source shell/core/version.sh
          file_version=$(getScriptVersion)
          if [ -z "$file_version" ]; then
            echo "Unable to read script version" >&2
            exit 1
          fi
          echo "file_version=$file_version" >> "$GITHUB_OUTPUT"
          echo "$file_version"

      - name: Get release
        id: release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = '${{ steps.version.outputs.file_version }}';
            const { owner, repo } = context.repo;
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag })
              .then(({ data }) => data)
              .catch(error => {
                if (error.status === 404) return null;
                throw error;
              });
            return release ? release.tag_name : '';
          result-encoding: string

      - name: Create release
        if: ${{ steps.release.outputs.result != steps.version.outputs.file_version }}
        uses: actions/github-script@v9
        with:
          script: |
            const tag = '${{ steps.version.outputs.file_version }}';
            const { owner, repo } = context.repo;
            const commits = await github.rest.repos.listCommits({ owner, repo, per_page: 1 });
            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              body: commits.data[0]?.commit?.message || tag
            });
