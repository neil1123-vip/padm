name: Release

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: Publish even without pending runtime changes
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'install.sh'
      - 'install-docker.sh'
      - 'shell/**'
      - '!shell/regression/**'
      - '!shell/subscription_groups_regression.sh'
      - '!shell/validate_install.sh'
      - '!shell/build-sing-box.sh'
      - 'docker/**'
      - 'docker-bake.hcl'
      - 'versions.lock'
      - 'assets/**'

permissions:
  contents: read

concurrency:
  group: padm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      release_version: ${{ steps.resolve.outputs.release_version }}
      release_sha: ${{ steps.target.outputs.release_sha }}
      deferred: ${{ steps.revision.outputs.deferred }}
      skip: ${{ steps.revision.outputs.deferred == 'true' || steps.scope.outputs.changed != 'true' || steps.existing.outputs.result == 'true' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use latest workflow revision
        id: revision
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release }}
        run: |
          set -euo pipefail
          if git diff --quiet "${WORKFLOW_SHA}" HEAD -- \
            .github/workflows/create_release.yml .github/workflows/build-images.yml; then
            echo 'deferred=false' >>"${GITHUB_OUTPUT}"
          else
            gh workflow run create_release.yml --repo "${GITHUB_REPOSITORY}" --ref main \
              -F force_release="${FORCE_RELEASE}"
            echo 'deferred=true' >>"${GITHUB_OUTPUT}"
            echo 'Release handed to the latest workflow revision.' >>"${GITHUB_STEP_SUMMARY}"
          fi

      - name: Read script version and lock
        id: version
        if: steps.revision.outputs.deferred != 'true'
        shell: bash
        run: |
          set -euo pipefail
          current_version=$(sed -n 's/^SCRIPT_VERSION="\([^"]*\)"$/\1/p' shell/core/version.sh | head -n 1)
          [[ -n "${current_version}" ]] || { echo 'Unable to read script version' >&2; exit 1; }
          bash docker/release.sh validate-lock "${current_version}"
          is_release_commit=false
          if git log -1 --format=%s | grep -qE '^chore\(release\): v[0-9]+\.[0-9]+\.[0-9]+$'; then
            is_release_commit=true
          fi
          echo "current_version=${current_version}" >>"${GITHUB_OUTPUT}"
          echo "is_release_commit=${is_release_commit}" >>"${GITHUB_OUTPUT}"

      - name: Read latest published version
        id: latest
        if: steps.revision.outputs.deferred != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const release = await github.rest.repos.getLatestRelease(context.repo)
              .then(({ data }) => data).catch(error => {
                if (error.status === 404) return null;
                throw error;
              });
            if (!release) return '';
            if (release.draft || release.prerelease || !/^v\d+\.\d+\.\d+$/.test(release.tag_name)) {
              throw new Error('Latest release is not a stable padm version');
            }
            return release.tag_name;
          result-encoding: string

      - name: Check unreleased runtime changes
        id: scope
        if: steps.revision.outputs.deferred != 'true'
        shell: bash
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release }}
          LATEST_TAG: ${{ steps.latest.outputs.result }}
        run: |
          set -euo pipefail
          latest_tag=${LATEST_TAG}
          changed=true
          if [[ -n "${latest_tag}" ]]; then
            git merge-base --is-ancestor "${latest_tag}" HEAD
          fi
          if [[ "${FORCE_RELEASE}" != true && -n "${latest_tag}" ]] &&
            git diff --quiet "${latest_tag}" HEAD -- install.sh install-docker.sh shell docker \
              docker-bake.hcl versions.lock assets \
              ':(exclude)shell/regression/**' ':(exclude)shell/subscription_groups_regression.sh' \
              ':(exclude)shell/validate_install.sh' ':(exclude)shell/build-sing-box.sh' \
              ':(exclude)docker/tests/**' ':(exclude)docker/release.sh'; then
            changed=false
          fi
          echo "latest_tag=${latest_tag}" >>"${GITHUB_OUTPUT}"
          echo "changed=${changed}" >>"${GITHUB_OUTPUT}"
          [[ "${changed}" == true ]] || echo 'No unreleased runtime changes.' >>"${GITHUB_STEP_SUMMARY}"

      - name: Resolve release version
        id: resolve
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          IS_RELEASE_COMMIT: ${{ steps.version.outputs.is_release_commit }}
          LATEST_TAG: ${{ steps.scope.outputs.latest_tag }}
        run: |
          set -euo pipefail
          latest_tag=${LATEST_TAG}
          if [[ -z "${latest_tag}" ]]; then
            latest_tag="v${CURRENT_VERSION}"
          fi
          if [[ "${IS_RELEASE_COMMIT}" == true ]]; then
            release_version="${CURRENT_VERSION}"
            needs_bump=false
          else
            if git rev-parse -q --verify "refs/tags/${latest_tag}" >/dev/null; then
              commits=$(git log --format=%B "${latest_tag}..HEAD")
            else
              commits=$(git log --format=%B)
            fi
            # 运行内容变化至少递增补丁版本，避免非约定格式的提交被遗漏。
            commits+=$'\nfix: release runtime changes'
            release_version=$(source shell/core/version.sh; nextScriptVersionFromCommits "${latest_tag}" "${commits}")
            needs_bump=true
            [[ "${release_version}" == "${CURRENT_VERSION}" ]] && needs_bump=false
          fi
          [[ "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "invalid release version: ${release_version}" >&2
            exit 1
          }
          echo "release_version=${release_version}" >>"${GITHUB_OUTPUT}"
          echo "needs_bump=${needs_bump}" >>"${GITHUB_OUTPUT}"

      - name: Check complete release assets
        id: existing
        if: steps.scope.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: v${{ steps.resolve.outputs.release_version }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag })
              .then(({ data }) => data)
              .catch(error => {
                if (error.status === 404) return null;
                throw error;
              });
            const required = [
              'release-manifest.json',
              'release-manifest.sigstore.json',
              'padm-docker-bundle.tar.gz'
            ];
            return release && !release.draft && !release.prerelease && required.every(name =>
              release.assets.filter(asset => asset.name === name && asset.size > 0 &&
                /^sha256:[0-9a-f]{64}$/.test(asset.digest || '')).length === 1)
              ? 'true'
              : 'false';
          result-encoding: string

      - name: Bump script and lock version
        id: bump
        if: ${{ steps.resolve.outputs.needs_bump == 'true' && steps.existing.outputs.result != 'true' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.release_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release }}
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse HEAD)
          bash docker/release.sh set-version "${RELEASE_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shell/core/version.sh versions.lock
          git commit -m "chore(release): v${RELEASE_VERSION}"
          release_sha=$(git rev-parse HEAD)
          if ! git push origin HEAD:main; then
            git fetch origin main
            if [[ "$(git rev-parse origin/main)" != "${base_sha}" ]]; then
              # 文档等被过滤的推送也可能造成竞争，重新调度后必须重新解析版本。
              gh workflow run create_release.yml --repo "${GITHUB_REPOSITORY}" --ref main \
                -F force_release="${FORCE_RELEASE}"
              echo '::notice::Main advanced; a new release run will resolve the latest source.'
            fi
            exit 1
          fi
          echo "release_sha=${release_sha}" >>"${GITHUB_OUTPUT}"

      - name: Resolve build commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          release_sha="${{ steps.bump.outputs.release_sha }}"
          if [[ -z "${release_sha}" ]]; then
            release_sha=$(git rev-parse HEAD)
          fi
          [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "release_sha=${release_sha}" >>"${GITHUB_OUTPUT}"

  images:
    name: Validate or publish images
    needs: prepare
    if: ${{ needs.prepare.outputs.deferred == 'false' }}
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version: ${{ needs.prepare.outputs.release_version || 'dev' }}
      source_ref: ${{ needs.prepare.outputs.release_sha }}
      registry: ghcr.io/neil1123-vip
      push: ${{ needs.prepare.outputs.skip != 'true' }}
      contracts_only: ${{ needs.prepare.outputs.skip == 'true' }}
    secrets: inherit

  release:
    name: Publish Release
    needs: [prepare, images]
    if: ${{ needs.prepare.outputs.skip != 'true' && needs.images.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 1

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.images.outputs.artifact_name }}
          path: release-assets

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign and verify release manifest
        shell: bash
        env:
          PADM_COSIGN_IDENTITY_REGEX: https://github.com/${{ github.repository }}/.github/workflows/.*@refs/heads/main
          PADM_COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          manifest=release-assets/release-manifest.json
          bundle=release-assets/release-manifest.sigstore.json
          jq -e --arg version "${RELEASE_VERSION}" --arg commit "${RELEASE_SHA}" \
            '.schema_version == 1 and .release.version == $version and .release.commit == $commit' \
            "${manifest}" >/dev/null
          cosign sign-blob --yes --new-bundle-format=true --bundle "${bundle}" "${manifest}"
          jq -e '.mediaType == "application/vnd.dev.sigstore.bundle.v0.3+json"' \
            "${bundle}" >/dev/null
          cosign verify-blob --bundle "${bundle}" \
            --certificate-identity-regexp "${PADM_COSIGN_IDENTITY_REGEX}" \
            --certificate-oidc-issuer "${PADM_COSIGN_OIDC_ISSUER}" "${manifest}" >/dev/null

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          assets=(release-manifest.json release-manifest.sigstore.json padm-docker-bundle.tar.gz)
          cd release-assets
          for asset in "${assets[@]}"; do [[ -s "${asset}" ]]; done
          gh api "repos/${GH_REPO}/releases?per_page=100" --paginate --slurp >"${RUNNER_TEMP}/releases.json"
          release_id=$(jq -r --arg tag "${tag}" '
            [.[][] | select(.tag_name == $tag)] |
            if length > 1 then error("Duplicate release tags") else .[0].id // "" end
          ' "${RUNNER_TEMP}/releases.json")
          if [[ -z "${release_id}" ]]; then
            release_id=$(gh api --method POST "repos/${GH_REPO}/releases" \
              -f tag_name="${tag}" -f target_commitish="${RELEASE_SHA}" -f name="${tag}" \
              -F draft=true -F prerelease=false -f make_latest=false \
              -f body="Automated Docker release ${tag}" --jq .id)
          fi
          [[ "${release_id}" =~ ^[0-9]+$ ]]
          gh api "repos/${GH_REPO}/releases/${release_id}" >"${RUNNER_TEMP}/release.json"
          jq -e --arg tag "${tag}" '.tag_name == $tag and .draft == true' \
            "${RUNNER_TEMP}/release.json" >/dev/null
          # 失败草稿可随新源码重试，但不移动已存在且指向其它提交的标签。
          gh api "repos/${GH_REPO}/git/matching-refs/tags/${tag}" >"${RUNNER_TEMP}/tag-refs.json"
          jq -e --arg ref "refs/tags/${tag}" --arg commit "${RELEASE_SHA}" '
            [.[] | select(.ref == $ref)] |
            length == 0 or (length == 1 and .[0].object.type == "commit" and .[0].object.sha == $commit)
          ' "${RUNNER_TEMP}/tag-refs.json" >/dev/null
          gh api --method PATCH "repos/${GH_REPO}/releases/${release_id}" \
            -f target_commitish="${RELEASE_SHA}" -F draft=true -f make_latest=false --silent
          gh release upload "${tag}" "${assets[@]}" --clobber
          gh api "repos/${GH_REPO}/releases/${release_id}" >"${RUNNER_TEMP}/release.json"
          for asset in "${assets[@]}"; do
            digest="sha256:$(sha256sum "${asset}" | cut -d ' ' -f 1)"
            jq -e --arg name "${asset}" --arg digest "${digest}" \
              '[.assets[] | select(.name == $name and .digest == $digest and .size > 0)] | length == 1' \
              "${RUNNER_TEMP}/release.json" >/dev/null
          done
          gh api --method PATCH "repos/${GH_REPO}/releases/${release_id}" \
            -F draft=false -F prerelease=false -f make_latest=true --silent
