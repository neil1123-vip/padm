name: Refresh Upstream Versions

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: refresh-upstream-versions
  cancel-in-progress: false

jobs:
  latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Detect latest stable sing-box release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release=$(gh api repos/SagerNet/sing-box/releases/latest)
          version=$(jq -er 'select(.draft == false and .prerelease == false) | .tag_name |
            select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<<"${release}")
          printf 'version=%s\n' "${version}" >>"${GITHUB_OUTPUT}"

  sing_box:
    needs: latest
    permissions:
      contents: write
    uses: ./.github/workflows/build-sing-box.yml
    with:
      version: ${{ needs.latest.outputs.version }}

  refresh:
    needs: sing_box
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Check for a pending update
        id: pending
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count=$(gh pr list --repo "${GITHUB_REPOSITORY}" --base main --state open --limit 100 \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("codex/upstream-versions-"))] | length')
          if [[ "${count}" -gt 0 ]]; then
            echo 'skip=true' >>"${GITHUB_OUTPUT}"
            echo 'A pending upstream update PR already exists.' >>"${GITHUB_STEP_SUMMARY}"
          else
            echo 'skip=false' >>"${GITHUB_OUTPUT}"
          fi

      - name: Refresh stable upstream releases
        if: steps.pending.outputs.skip != 'true'
        id: update
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash docker/release.sh refresh-upstreams
          if git diff --quiet -- versions.lock; then
            echo 'changed=false' >>"${GITHUB_OUTPUT}"
            echo 'Upstream versions are current.' >>"${GITHUB_STEP_SUMMARY}"
          else
            echo 'changed=true' >>"${GITHUB_OUTPUT}"
            git diff -- versions.lock
          fi

      - name: Validate the refreshed lock
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash -n docker/release.sh
          git diff --check
          bash docker/release.sh validate-lock
          bash docker/tests/phase5.sh

      - name: Open update PR and ensure Docker CI
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set -a
          . ./versions.lock
          set +a
          branch="codex/upstream-versions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title='chore(deps): refresh upstream versions'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${branch}"
          git add versions.lock
          git commit -m "${title}"
          git push --set-upstream origin "${branch}"
          commit_sha=$(git rev-parse HEAD)
          body_file="${RUNNER_TEMP}/upstream-pr-body.md"
          printf '%s\n\n%s\n%s\n%s\n\n%s\n' \
            'Refresh the pinned stable upstream releases and their downloaded SHA-256 values.' \
            "- Xray: ${PADM_LOCK_XRAY_VERSION}" \
            "- sing-box: ${PADM_LOCK_SING_BOX_VERSION}" \
            "- acme.sh: ${PADM_LOCK_ACME_SH_VERSION}" \
            'Docker CI validates this commit; the refresh task reuses its PR run or dispatches a fallback.' >"${body_file}"
          pr_url=$(gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${branch}" \
            --title "${title}" --body-file "${body_file}")
          find_ci_run() {
            gh run list --repo "${GITHUB_REPOSITORY}" --workflow docker-ci.yml \
              --branch "${branch}" --commit "${commit_sha}" --limit 100 \
              --json databaseId,event,conclusion --jq '[.[] | select(.event == "workflow_dispatch" or (.event == "pull_request" and .conclusion != "action_required"))] | .[0].databaseId // empty'
          }
          ci_run_id=$(find_ci_run)
          passed=false
          for _ in {1..3}; do
            for _ in {1..3}; do
              [[ -n "${ci_run_id}" ]] && break
              sleep 2
              ci_run_id=$(find_ci_run)
            done
            if [[ -z "${ci_run_id}" ]]; then
              # 机器人 PR 可能缺少运行或等待人工批准，使用显式派发验证本次生成的分支。
              gh workflow run docker-ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${branch}"
            fi
            for _ in {1..30}; do
              [[ "${ci_run_id}" =~ ^[0-9]+$ ]] && break
              sleep 2
              ci_run_id=$(find_ci_run)
            done
            [[ "${ci_run_id}" =~ ^[0-9]+$ ]] || {
              echo "Docker CI did not expose a run for ${commit_sha}" >&2
              exit 1
            }
            if gh run watch "${ci_run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status; then
              passed=true
              break
            fi
            result=$(gh run view "${ci_run_id}" --repo "${GITHUB_REPOSITORY}" --json conclusion,event --jq '.conclusion + ":" + .event')
            if [[ "${result}" == action_required:pull_request ]]; then
              # 排队后才转入审批的 PR 也由下一轮查找触发显式派发。
              ci_run_id=$(find_ci_run)
              continue
            fi
            [[ "${result}" == cancelled:* ]] || exit 1
            # 两种事件同时到达时，等待同一提交取代被取消运行的验证。
            replacement=$(find_ci_run)
            [[ "${replacement}" =~ ^[0-9]+$ && "${replacement}" -gt "${ci_run_id}" ]] || exit 1
            ci_run_id=${replacement}
          done
          [[ "${passed}" == true ]] || { echo 'Docker CI did not complete successfully' >&2; exit 1; }
          printf 'Created %s and Docker CI run %s passed.\n' "${pr_url}" "${ci_run_id}" >>"${GITHUB_STEP_SUMMARY}"
