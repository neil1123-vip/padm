name: Refresh Upstream Versions

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-upstream-versions
  cancel-in-progress: false

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Detect latest stable sing-box release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release=$(gh api repos/SagerNet/sing-box/releases/latest)
          version=$(jq -er 'select(.draft == false and .prerelease == false) | .tag_name |
            select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<<"${release}")
          printf 'version=%s\n' "${version}" >>"${GITHUB_OUTPUT}"

  sing_box:
    needs: latest
    permissions:
      contents: write
    uses: ./.github/workflows/build-sing-box.yml
    with:
      version: ${{ needs.latest.outputs.version }}

  refresh:
    needs: sing_box
    if: ${{ !cancelled() && (needs.sing_box.result == 'success' || needs.sing_box.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare update branch
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="codex/upstream-versions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch --create "${branch}"
          printf 'branch=%s\nbase_sha=%s\n' "${branch}" "${base_sha}" >>"${GITHUB_OUTPUT}"

      - name: Refresh stable upstream releases
        id: update
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SING_BOX_RESULT: ${{ needs.sing_box.result }}
        run: |
          set -euo pipefail
          if [[ "${SING_BOX_RESULT}" == failure ]]; then
            echo 'The sing-box build failed; refreshing only complete published releases. The failed build remains visible.' >>"${GITHUB_STEP_SUMMARY}"
          fi
          bash docker/release.sh refresh-upstreams
          if git diff --quiet -- versions.lock; then
            echo 'changed=false' >>"${GITHUB_OUTPUT}"
            echo 'Upstream versions are current.' >>"${GITHUB_STEP_SUMMARY}"
          else
            echo 'changed=true' >>"${GITHUB_OUTPUT}"
            git diff -- versions.lock
          fi

      - name: Validate the refreshed lock
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash -n docker/release.sh
          git diff --check
          bash docker/release.sh validate-lock
          # 完整 Docker contract 由更新分支的 Docker CI 统一执行。

      - name: Preflight refreshed Alpine dependencies
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: bash docker/release.sh preflight

      - name: Save update branch
        id: save
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.pending.outputs.branch }}
        run: |
          set -euo pipefail
          branch=${BRANCH}
          git add versions.lock
          git commit -m 'chore(deps): refresh upstream versions'
          commit_sha=$(git rev-parse HEAD)
          git push --set-upstream origin "${branch}"
          printf 'branch=%s\ncommit_sha=%s\n' "${branch}" "${commit_sha}" >>"${GITHUB_OUTPUT}"

      - name: Ensure Docker CI
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.save.outputs.branch }}
          COMMIT_SHA: ${{ steps.save.outputs.commit_sha }}
        run: |
          set -euo pipefail
          branch=${BRANCH}
          commit_sha=${COMMIT_SHA}
          assert_update_head() {
            [[ "$(git ls-remote origin "refs/heads/${branch}" | cut -f1)" == "${commit_sha}" ]] || {
              echo 'The update branch changed during validation; retry from current main.' >&2; return 1;
            }
          }
          assert_update_head
          find_ci_run() {
            gh run list --repo "${GITHUB_REPOSITORY}" --workflow docker-ci.yml \
              --event workflow_dispatch --branch "${branch}" --commit "${commit_sha}" --limit 100 \
              --json databaseId --jq '.[0].databaseId // empty'
          }
          gh workflow run docker-ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${branch}"
          ci_run_id=
          for _ in {1..30}; do
            ci_run_id=$(find_ci_run)
            [[ "${ci_run_id}" =~ ^[0-9]+$ ]] && break
            sleep 2
          done
          [[ "${ci_run_id}" =~ ^[0-9]+$ ]] || {
            echo "Docker CI did not expose a run for ${commit_sha}" >&2; exit 1;
          }
          gh run watch "${ci_run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status
          assert_update_head
          printf 'Update %s passed Docker CI run %s.\n' "${commit_sha}" "${ci_run_id}" >>"${GITHUB_STEP_SUMMARY}"

      - name: Promote validated update
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.pending.outputs.base_sha }}
          COMMIT_SHA: ${{ steps.save.outputs.commit_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          # main 已前进时重新生成、验证更新，不合入未经验证的合并提交。
          [[ "$(git rev-parse FETCH_HEAD)" == "${BASE_SHA}" ]] || {
            echo 'main changed during validation; retry the upstream refresh.' >&2; exit 1;
          }
          [[ "$(git diff --name-only "${BASE_SHA}" "${COMMIT_SHA}")" == versions.lock ]] || {
            echo 'The validated update changes files outside versions.lock.' >&2; exit 1;
          }
          git push origin "${COMMIT_SHA}:refs/heads/main"
          printf 'Promoted validated update %s to main.\n' "${COMMIT_SHA}" >>"${GITHUB_STEP_SUMMARY}"

      - name: Ensure Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCK_CHANGED: ${{ steps.update.outputs.changed }}
        run: |
          set -euo pipefail
          # 派发失败后可能已有文档提交，按最近锁变更识别待接续更新。
          if [[ "${LOCK_CHANGED}" != true ]]; then
            lock_commit=$(git log -1 --format=%H -- versions.lock)
            [[ -n "${lock_commit}" ]] || exit 0
            [[ "$(git log -1 --format=%s "${lock_commit}")" == 'chore(deps): refresh upstream versions' ]] || exit 0
            [[ "$(git diff-tree --no-commit-id --name-only -r "${lock_commit}")" == versions.lock ]] || exit 0
          fi
          # GITHUB_TOKEN 推送不会触发 push workflow，显式派发既有发布流程。
          gh workflow run create_release.yml --repo "${GITHUB_REPOSITORY}" --ref main -F force_release=false
          printf 'Release dispatched for the upstream update.\n' >>"${GITHUB_STEP_SUMMARY}"
