name: Dependabot Automation

on:
  workflow_run:
    workflows: [Docker CI]
    types: [completed]
    branches: ['dependabot/github_actions/**']
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-automation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Merge validated Dependabot updates
        uses: actions/github-script@v9
        env:
          WORKFLOW_TOKEN_CONFIGURED: ${{ secrets.DEPENDABOT_AUTOMATION_TOKEN != '' }}
        with:
          github-token: ${{ secrets.DEPENDABOT_AUTOMATION_TOKEN || github.token }}
          script: |
            const reconcile = require('./.github/scripts/dependabot-merge.cjs');
            await reconcile({
              github, context, core,
              workflowTokenConfigured: process.env.WORKFLOW_TOKEN_CONFIGURED === 'true',
            });
